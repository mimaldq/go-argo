name: Build and Push Docker Image

on:
  workflow_dispatch:
    inputs:
      image-tag:
        description: '镜像标签 (例如: latest, v1.0)'
        required: true
        default: 'latest'
        type: string
      custom-image-name:
        description: '自定义镜像名称 (留空则使用默认:go-argo)'
        required: false
        default: ''
        type: string

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/go-arg0

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Determine final image name
        id: determine-image
        run: |
          if [ -n "${{ github.event.inputs.custom-image-name }}" ]; then
            FINAL_IMAGE_NAME="${{ github.event.inputs.custom-image-name }}"
            echo "使用自定义镜像名称: $FINAL_IMAGE_NAME"
          else
            FINAL_IMAGE_NAME="${{ env.IMAGE_NAME }}"
            echo "使用默认镜像名称: $FINAL_IMAGE_NAME"
          fi
          
          echo "FINAL_IMAGE_NAME=$FINAL_IMAGE_NAME" >> $GITHUB_ENV
          echo "FULL_IMAGE_TAG=${{ env.REGISTRY }}/$FINAL_IMAGE_NAME:${{ github.event.inputs.image-tag }}" >> $GITHUB_ENV

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ env.FULL_IMAGE_TAG }}

      - name: Image report
        run: |
          echo "镜像构建成功!"
          echo "镜像地址: ${{ env.FULL_IMAGE_TAG }}"
          echo "拉取命令: docker pull ${{ env.FULL_IMAGE_TAG }}"
