name: Build and Push Docker Image

on:
  workflow_dispatch:
    inputs:
      image_name:
        description: 'Docker镜像名称 (默认: go-argo)'
        required: false
        default: 'go-argo'
        type: string
      image_tag:
        description: 'Docker镜像标签 (默认: latest)'
        required: false
        default: 'latest'
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        id: build-push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ inputs.image_name }}:${{ inputs.image_tag }}
            ghcr.io/${{ github.repository_owner }}/${{ inputs.image_name }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=HTTP Server
            org.opencontainers.image.licenses=MIT
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # 添加metadata输出
          outputs: type=image,name=ghcr.io/${{ github.repository_owner }}/${{ inputs.image_name }},push-by-digest=true,name-canonical=true

      - name: Inspect and display image size
        run: |
          # 获取构建的镜像digest
          DIGEST="${{ steps.build-push.outputs.digest }}"
          
          if [ -n "$DIGEST" ]; then
            echo "Image digest: $DIGEST"
            
            # 使用docker manifest inspect检查多平台镜像大小
            FULL_IMAGE_NAME="ghcr.io/${{ github.repository_owner }}/${{ inputs.image_name }}:${{ inputs.image_tag }}"
            
            echo "=== Image Size Information ==="
            echo "Checking image: $FULL_IMAGE_NAME"
            
            # 检查每个平台的镜像大小
            MANIFEST_INFO=$(docker buildx imagetools inspect "$FULL_IMAGE_NAME" --raw 2>/dev/null || docker manifest inspect "$FULL_IMAGE_NAME" 2>/dev/null)
            
            if [ -n "$MANIFEST_INFO" ]; then
              echo "Multi-platform image manifest found:"
              
              # 使用jq解析manifest信息（如果可用）
              if command -v jq >/dev/null 2>&1; then
                echo $MANIFEST_INFO | jq -r '
                  if .manifests then
                    "Platforms found:",
                    (.manifests[] | "  - \(.platform.os)/\(.platform.architecture): \(.size / 1024 / 1024 | floor) MB (\(.size) bytes)")
                  elif .schemaVersion == 2 and .mediaType then
                    "Single platform image: \(.config.size / 1024 / 1024 | floor) MB (\(.config.size) bytes)"
                  else
                    "Unknown manifest format"
                  end'
                
                # 计算总大小
                TOTAL_SIZE=$(echo $MANIFEST_INFO | jq '[.manifests[].size] | add // .config.size // 0')
                if [ "$TOTAL_SIZE" -gt 0 ]; then
                  TOTAL_MB=$(echo "$TOTAL_SIZE / 1024 / 1024" | bc)
                  echo ""
                  echo "Total compressed size (all platforms): $TOTAL_MB MB"
                fi
              else
                echo "jq not available, showing raw manifest info:"
                echo "$MANIFEST_INFO"
              fi
            else
              echo "Unable to retrieve image manifest information"
            fi
            
            # 尝试使用docker inspect获取本地构建缓存中的镜像大小
            echo ""
            echo "=== Checking local build cache ==="
            docker buildx du --verbose || echo "Buildx disk usage command not available"
          else
            echo "No image digest found in build output"
          fi

      - name: Display additional build information
        run: |
          # 显示构建时间信息
          if [ -n "${{ steps.build-push.outputs.imageid }}" ]; then
            echo "Build completed successfully!"
            echo "Image ID: ${{ steps.build-push.outputs.imageid }}"
          fi
          
          # 显示标签信息
          echo ""
          echo "=== Image Tags ==="
          echo "Primary tag: ghcr.io/${{ github.repository_owner }}/${{ inputs.image_name }}:${{ inputs.image_tag }}"
          echo "Latest tag: ghcr.io/${{ github.repository_owner }}/${{ inputs.image_name }}:latest"
          
          # 显示仓库URL
          echo ""
          echo "=== Container Registry URL ==="
          echo "https://ghcr.io/${{ github.repository_owner }}/${{ inputs.image_name }}"
