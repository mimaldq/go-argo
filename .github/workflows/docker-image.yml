name: Build and Push Docker Image (Manual)

on:
  workflow_dispatch:
    inputs:
      image_name:
        description: 'Docker镜像名称'
        required: false
        default: 'go-argo'
        type: string
      image_tag:
        description: 'Docker镜像标签'
        required: false
        default: 'latest'
        type: string
      push_latest:
        description: '是否同时推送latest标签'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        id: build-image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false  # 先不推送，构建后检查大小
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ inputs.image_name }}:${{ inputs.image_tag }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=HTTP Server
            org.opencontainers.image.licenses=MIT
          cache-from: type=gha
          cache-to: type=gha,mode=max
          outputs: type=docker,dest=/tmp/image.tar

      - name: Check image size before push
        run: |
          echo "🔍 正在检查镜像大小..."
          
          # 加载镜像以便检查
          docker load -i /tmp/image.tar
          
          # 获取镜像信息
          IMAGE_NAME="ghcr.io/${{ github.repository_owner }}/${{ inputs.image_name }}:${{ inputs.image_tag }}"
          
          # 查找刚加载的镜像ID
          IMAGE_ID=$(docker images --format "{{.ID}}" --filter "reference=$IMAGE_NAME" | head -1)
          
          if [ -z "$IMAGE_ID" ]; then
            echo "❌ 无法找到镜像"
            exit 1
          fi
          
          # 获取镜像详细信息
          SIZE_BYTES=$(docker image inspect $IMAGE_ID --format='{{.Size}}')
          LAYER_COUNT=$(docker image inspect $IMAGE_ID --format='{{len .RootFS.Layers}}')
          CREATED=$(docker image inspect $IMAGE_ID --format='{{.Created}}')
          
          # 计算MB大小
          SIZE_MB=$(echo "scale=2; $SIZE_BYTES / 1024 / 1024" | bc)
          
          echo ""
          echo "📊 镜像分析结果："
          echo "├─ 镜像名称: $IMAGE_NAME"
          echo "├─ 镜像大小: ${SIZE_MB} MB"
          echo "├─ 总层数: ${LAYER_COUNT}"
          echo "└─ 创建时间: ${CREATED}"
          
          echo ""
          echo "📋 镜像层历史（前8层）："
          docker history $IMAGE_ID --no-trunc --format "table {{.CreatedSince}}\t{{.Size}}\t{{.CreatedBy}}" | head -8
          
          # 保存镜像信息供后续步骤使用
          echo "IMAGE_ID=$IMAGE_ID" >> $GITHUB_ENV
          echo "IMAGE_NAME=$IMAGE_NAME" >> $GITHUB_ENV
          echo "IMAGE_SIZE_MB=$SIZE_MB" >> $GITHUB_ENV

      - name: Push Docker image
        run: |
          echo "🚀 正在推送镜像..."
          
          # 获取镜像ID和名称
          IMAGE_ID="${{ env.IMAGE_ID }}"
          IMAGE_NAME="${{ env.IMAGE_NAME }}"
          
          # 重新标记为多平台镜像并推送
          if [ "${{ inputs.push_latest }}" = "true" ]; then
            echo "推送标签: $IMAGE_NAME 和 latest"
            
            # 为单平台镜像标记并推送
            docker tag $IMAGE_ID $IMAGE_NAME
            docker push $IMAGE_NAME
            
            # 标记并推送latest标签
            LATEST_NAME="${IMAGE_NAME%:*}:latest"
            docker tag $IMAGE_ID $LATEST_NAME
            docker push $LATEST_NAME
            
            echo "✅ 已推送: $IMAGE_NAME 和 $LATEST_NAME"
          else
            echo "推送标签: $IMAGE_NAME"
            docker tag $IMAGE_ID $IMAGE_NAME
            docker push $IMAGE_NAME
            echo "✅ 已推送: $IMAGE_NAME"
          fi
          
          # 清理临时文件
          rm -f /tmp/image.tar

      - name: Summary
        run: |
          echo ""
          echo "🎉 镜像构建完成！"
          echo "📦 镜像仓库: ghcr.io/${{ github.repository_owner }}/${{ inputs.image_name }}"
          echo "🏷️  已推送标签: ${{ inputs.image_tag }}${{ inputs.push_latest == 'true' && ' 和 latest' || '' }}"
          echo "📏 镜像大小: ${{ env.IMAGE_SIZE_MB }} MB"
          echo ""
          echo "使用以下命令拉取镜像："
          echo "docker pull ghcr.io/${{ github.repository_owner }}/${{ inputs.image_name }}:${{ inputs.image_tag }}"
          if [ "${{ inputs.push_latest }}" = "true" ]; then
            echo "docker pull ghcr.io/${{ github.repository_owner }}/${{ inputs.image_name }}:latest"
          fi
