name: Build and Push Docker Image

on:
  workflow_dispatch:
    inputs:
      image_name:
        description: 'Docker镜像名称 (默认: go-argo)'
        required: false
        default: 'go-argo'
        type: string
      image_tag:
        description: 'Docker镜像标签 (默认: latest)'
        required: false
        default: 'latest'
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        id: build-push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ inputs.image_name }}:${{ inputs.image_tag }}
            ghcr.io/${{ github.repository_owner }}/${{ inputs.image_name }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=HTTP Server
            org.opencontainers.image.licenses=MIT
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Check multi-platform image sizes
        run: |
          IMAGE_TAG="ghcr.io/${{ github.repository_owner }}/${{ inputs.image_name }}:${{ inputs.image_tag }}"
          
          echo "📊 Multi-platform Image Size Report"
          echo "=================================="
          
          # 使用docker buildx imagetools inspect获取详细大小信息
          docker buildx imagetools inspect $IMAGE_TAG --format '
          {{- $totalSize := 0 -}}
          {{- range $manifest := .Manifests -}}
            {{- $platform := printf "%s/%s" $manifest.Platform.OS $manifest.Platform.Architecture -}}
            {{- $sizeMB := div $manifest.Size 1000000.0 -}}
            {{- $totalSize = add $totalSize $manifest.Size -}}
            Platform: {{$platform}}
            Size: {{printf "%.2f" $sizeMB}} MB
            -------------------------
          {{- end -}}
          {{- $totalSizeMB := div $totalSize 1000000.0 -}}
          
          Total Size (all platforms): {{printf "%.2f" $totalSizeMB}} MB
          '
          
          echo -e "\n✅ Image size check completed!"
